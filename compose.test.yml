services:
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    ports:
      - "127.0.0.1:25672:5672"
      - "127.0.0.1:25673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cucumber
      RABBITMQ_DEFAULT_PASS: local-test-only
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit max_message_size 33554432"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.2.0
    entrypoint: ["/bin/bash", "/etc/kafka/test-start.sh"]
    ports:
      - "127.0.0.1:29092:29092"
      - "127.0.0.1:29093:29093"
      - "127.0.0.1:29094:29094"
    volumes:
      - ./tests/fixtures/tls:/etc/kafka/test:ro
      - ./tests/fixtures/kafka-start.sh:/etc/kafka/test-start.sh:ro
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,PLAIN://:29092,SECURE://:29093,AUTH://:29094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,PLAIN://localhost:29092,SECURE://localhost:29093,AUTH://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,PLAIN:PLAINTEXT,SECURE:SSL,AUTH:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/test/kafka-server.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/test/localhost-cert.pem
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_LISTENER_NAME_AUTH_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="cucumber" password="local-test-only" user_cucumber="local-test-only";'
      KAFKA_LISTENER_NAME_AUTH_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_AUTH_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/qc-ready && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
