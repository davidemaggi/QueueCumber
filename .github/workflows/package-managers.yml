name: Package managers

# Publishes a stable release's files to package managers, without rebuilding anything: winget and
# Chocolatey (the signed Windows installer), Homebrew (a cask in the shared tap, from the macOS
# zip), AUR (queuecumber-bin, from the .deb) and Cloudsmith (apt and dnf repository, the .deb and
# .rpm). publish-packages.yml calls it when a stable release is published; run it by hand to retry
# a tag, to publish an existing release on some channels only, or to try it without publishing
# anything (submit off). Every job installs the real package before it publishes it.
# Metadata: packaging/package-managers.json; files: scripts/package-managers*.mjs.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      submit:
        type: boolean
        default: false
      channels:
        type: string
        default: winget,chocolatey,homebrew,aur,cloudsmith
    secrets:
      WINGET_TOKEN:
        required: false
      CHOCOLATEY_API_KEY:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
      AUR_SSH_PRIVATE_KEY:
        required: false
      CLOUDSMITH_API_KEY:
        required: false
  # TEMPORARY dry run: revert this commit
  push:
    branches: [feature/unix-package-managers]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, e.g. v1.0.5
        required: true
      submit:
        description: Publish (off = build and test only)
        type: boolean
        default: false
      channels:
        description: Comma-separated channels
        default: winget,chocolatey,homebrew,aur,cloudsmith

permissions:
  contents: read

concurrency:
  group: package-managers-${{ inputs.tag || 'v1.0.5' }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || 'v1.0.5' }}
  SUBMIT: ${{ inputs.submit == true && 'true' || 'false' }}
  GH_TOKEN: ${{ github.token }}
  CODESIGN_CERT_SUBJECT: ${{ vars.CODESIGN_CERT_SUBJECT }}

jobs:
  winget:
    name: winget
    if: contains(format(',{0},', inputs.channels || 'homebrew,aur,cloudsmith'), ',winget,')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'

      - name: Download and verify the signed installer
        id: installer
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Only stable release tags are published: $env:TAG" }
          $version = $env:TAG.TrimStart('v')
          $meta = Get-Content packaging/package-managers.json -Raw | ConvertFrom-Json
          $asset = $meta.windowsInstaller.asset.Replace('{version}', $version)
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p $asset -p $meta.windowsInstaller.checksums -D installer
          if ($LASTEXITCODE) { throw "gh release download failed ($LASTEXITCODE)" }
          $exe = Join-Path $PWD "installer\$asset"
          # Same bytes the signing job verified and listed in its checksum manifest
          $listed = Get-Content (Join-Path $PWD "installer\$($meta.windowsInstaller.checksums)") |
            Where-Object { $_ -match "^([0-9a-f]{64})\s+\*?$([regex]::Escape($asset))$" } |
            ForEach-Object { $Matches[1] }
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if (-not $listed -or $listed -ne $actual) { throw "$asset doesn't match $($meta.windowsInstaller.checksums)" }
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid') { throw "Authenticode signature is $($signature.Status)" }
          if (-not $signature.TimeStamperCertificate) { throw 'The signature has no timestamp' }
          $cn = $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($env:CODESIGN_CERT_SUBJECT -and $cn -ne $env:CODESIGN_CERT_SUBJECT) { throw "Signed by '$cn', expected '$env:CODESIGN_CERT_SUBJECT'" }
          Write-Host "Signed by $cn, SHA-256 $actual"
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install the signed installer and read what it registers
        id: probe
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.installer.outputs.version }}'
          $meta = Get-Content packaging/package-managers.json -Raw | ConvertFrom-Json
          $process = Start-Process '${{ steps.installer.outputs.exe }}' -ArgumentList $meta.windowsInstaller.silentArgs -Wait -PassThru
          if ($process.ExitCode) { throw "The installer exited with $($process.ExitCode)" }

          $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $key = Get-ChildItem $uninstallRoot |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "$($meta.name)*" } |
            Select-Object -First 1
          if (-not $key) { throw "The installer registered nothing in $uninstallRoot" }
          $app = Get-ItemProperty $key.PSPath
          $productCode = $key.PSChildName
          Write-Host "Product code: $productCode"
          Write-Host "DisplayName: $($app.DisplayName) · DisplayVersion: $($app.DisplayVersion) · Publisher: $($app.Publisher)"
          if ($app.DisplayVersion -ne $version) { throw "Registered version $($app.DisplayVersion), expected $version" }
          if ($app.UninstallString -notmatch '^"([^"]+)"\s*(.*)$') { throw "Unexpected UninstallString: $($app.UninstallString)" }
          $uninstaller = $Matches[1]
          $uninstallArgs = $Matches[2]
          # electron-builder writes no InstallLocation; the uninstaller sits in the app's folder
          $location = if ($app.InstallLocation) { $app.InstallLocation } else { Split-Path $uninstaller }
          Write-Host "Installed in: $location"

          # The installed app is this version and starts. QueueCumber has no command-line interface.
          $appExe = Join-Path $location "$($meta.name).exe"
          $fileVersion = (Get-Item $appExe).VersionInfo.ProductVersion
          # Windows file versions have four parts: 1.0.4.0
          if ($fileVersion -notin @($version, "$version.0")) { throw "$appExe is version $fileVersion, expected $version" }
          $profileDir = Join-Path $env:RUNNER_TEMP 'qc-profile'
          $running = Start-Process $appExe -ArgumentList "--user-data-dir=`"$profileDir`"" -PassThru
          Start-Sleep 15
          if ($running.HasExited) { throw "$($meta.name) exited at start with $($running.ExitCode)" }
          Write-Host "$($meta.name) $fileVersion started"
          Get-Process $meta.name -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2

          "product-code=$productCode" >> $env:GITHUB_OUTPUT
          "display-name=$($app.DisplayName)" >> $env:GITHUB_OUTPUT
          "publisher=$($app.Publisher)" >> $env:GITHUB_OUTPUT

          # Uninstall: winget's own test below starts from a clean machine
          $process = Start-Process $uninstaller -ArgumentList "$uninstallArgs $($meta.windowsInstaller.silentArgs)" -Wait -PassThru
          if ($process.ExitCode) { throw "The uninstaller exited with $($process.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Test-Path $key.PSPath); $i++) { Start-Sleep 1 }
          if (Test-Path $key.PSPath) { throw 'The uninstaller left its registry entry behind' }

      - name: Write the manifests
        id: manifests
        run: |
          $ErrorActionPreference = 'Stop'
          $released = (gh release view $env:TAG -R $env:GITHUB_REPOSITORY --json publishedAt | ConvertFrom-Json).publishedAt
          if ($LASTEXITCODE) { throw "gh release view failed ($LASTEXITCODE)" }
          $json = node scripts/package-managers.mjs --version $env:TAG `
            --installer '${{ steps.installer.outputs.exe }}' `
            --product-code '${{ steps.probe.outputs.product-code }}' `
            --display-name '${{ steps.probe.outputs.display-name }}' `
            --publisher '${{ steps.probe.outputs.publisher }}' `
            --date ([datetime]$released).ToUniversalTime().ToString('yyyy-MM-dd') --out out
          if ($LASTEXITCODE) { throw "package-managers.mjs failed ($LASTEXITCODE)" }
          $out = $json | Out-String | ConvertFrom-Json
          Get-ChildItem $out.winget | ForEach-Object { Write-Host "── $($_.Name)"; Get-Content $_.FullName }
          "dir=$($out.winget)" >> $env:GITHUB_OUTPUT

      - name: Validate and install from the manifests with winget
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
            Repair-WinGetPackageManager -Latest -Force
          }
          winget --version
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { throw "winget settings failed ($LASTEXITCODE)" }
          $dir = '${{ steps.manifests.outputs.dir }}'
          winget validate --manifest $dir
          if ($LASTEXITCODE) { throw "winget validate failed ($LASTEXITCODE)" }
          winget install --manifest $dir --accept-package-agreements --accept-source-agreements --disable-interactivity --silent
          if ($LASTEXITCODE) { throw "winget install failed ($LASTEXITCODE)" }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\${{ steps.probe.outputs.product-code }}')) {
            throw 'winget installed it, but not under the product code in the manifest'
          }

      - name: Submit to winget-pkgs
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SUBMIT -ne 'true') { Write-Host 'Dry run: nothing submitted'; exit 0 }
          if (-not $env:WINGET_TOKEN) { Write-Host "::notice::WINGET_TOKEN isn't set: winget skipped"; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          # The PR comes from the token owner's fork of microsoft/winget-pkgs, on a branch of its own
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN '${{ steps.manifests.outputs.dir }}'
          if ($LASTEXITCODE) { throw "wingetcreate submit failed ($LASTEXITCODE)" }

  chocolatey:
    name: Chocolatey
    if: contains(format(',{0},', inputs.channels || 'homebrew,aur,cloudsmith'), ',chocolatey,')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'

      - name: Build the package
        id: pack
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Only stable release tags are published: $env:TAG" }
          $version = $env:TAG.TrimStart('v')
          $meta = Get-Content packaging/package-managers.json -Raw | ConvertFrom-Json
          $asset = $meta.windowsInstaller.asset.Replace('{version}', $version)
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p $asset -D installer
          if ($LASTEXITCODE) { throw "gh release download failed ($LASTEXITCODE)" }
          $signature = Get-AuthenticodeSignature "installer\$asset"
          if ($signature.Status -ne 'Valid') { throw "Authenticode signature is $($signature.Status)" }
          $json = node scripts/package-managers.mjs --version $env:TAG --installer "installer\$asset" --out out
          if ($LASTEXITCODE) { throw "package-managers.mjs failed ($LASTEXITCODE)" }
          $out = $json | Out-String | ConvertFrom-Json
          Push-Location $out.chocolatey
          Get-Content "$($meta.chocolatey.id).nuspec"
          choco pack --no-progress
          if ($LASTEXITCODE) { throw "choco pack failed ($LASTEXITCODE)" }
          Pop-Location
          "dir=$($out.chocolatey)" >> $env:GITHUB_OUTPUT
          "id=$($meta.chocolatey.id)" >> $env:GITHUB_OUTPUT
          "name=$($meta.name)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install, check and uninstall with choco
        run: |
          $ErrorActionPreference = 'Stop'
          $id = '${{ steps.pack.outputs.id }}'
          $name = '${{ steps.pack.outputs.name }}'
          $version = '${{ steps.pack.outputs.version }}'
          choco install $id --source '${{ steps.pack.outputs.dir }}' --version $version -y --no-progress
          if ($LASTEXITCODE) { throw "choco install failed ($LASTEXITCODE)" }
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "$name*" } |
            Select-Object -First 1
          if (-not $key) { throw "choco install didn't install $name" }
          $app = Get-ItemProperty $key.PSPath
          # electron-builder writes no InstallLocation; the uninstaller sits in the app's folder
          if ($app.UninstallString -notmatch '^"([^"]+)"') { throw "Unexpected UninstallString: $($app.UninstallString)" }
          $appExe = Join-Path (Split-Path $Matches[1]) "$name.exe"
          $fileVersion = (Get-Item $appExe).VersionInfo.ProductVersion
          # Windows file versions have four parts: 1.0.4.0
          if ($fileVersion -notin @($version, "$version.0")) { throw "$appExe is version $fileVersion, expected $version" }
          $profileDir = Join-Path $env:RUNNER_TEMP 'qc-profile'
          $running = Start-Process $appExe -ArgumentList "--user-data-dir=`"$profileDir`"" -PassThru
          Start-Sleep 15
          if ($running.HasExited) { throw "$name exited at start with $($running.ExitCode)" }
          Write-Host "$name $fileVersion started"
          Get-Process $name -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2

          choco uninstall $id -y --no-progress
          if ($LASTEXITCODE) { throw "choco uninstall failed ($LASTEXITCODE)" }
          for ($i = 0; $i -lt 60 -and (Test-Path $key.PSPath); $i++) { Start-Sleep 1 }
          if (Test-Path $key.PSPath) { throw 'choco uninstall left the app installed' }
          if (Test-Path $appExe) { throw "choco uninstall left $appExe behind" }

      - name: Push to the Chocolatey community repository
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SUBMIT -ne 'true') { Write-Host 'Dry run: nothing pushed'; exit 0 }
          if (-not $env:CHOCOLATEY_API_KEY) { Write-Host "::notice::CHOCOLATEY_API_KEY isn't set: Chocolatey skipped"; exit 0 }
          $nupkg = Get-ChildItem '${{ steps.pack.outputs.dir }}\*.nupkg' | Select-Object -First 1
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE) { throw "choco push failed ($LASTEXITCODE)" }

  homebrew:
    name: Homebrew
    if: contains(format(',{0},', inputs.channels || 'homebrew,aur,cloudsmith'), ',homebrew,')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'

      - name: Write the cask
        id: cask
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only stable release tags are published: $TAG"; exit 1; }
          meta=packaging/package-managers.json
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$(jq -r .checksums $meta)" -D release
          node scripts/package-managers-unix.mjs --version "$TAG" --sums "release/$(jq -r .checksums $meta)" --out out
          name=$(jq -r .homebrew.cask $meta)
          cat "out/homebrew/Casks/$name.rb"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file=out/homebrew/Casks/$name.rb" >> "$GITHUB_OUTPUT"

      - name: Audit, install, check and uninstall with brew
        env:
          # brew audit --online asks GitHub's API; anonymously, shared runners hit the rate limit
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          CASK: ${{ steps.cask.outputs.name }}
          CASK_FILE: ${{ steps.cask.outputs.file }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          app="/Applications/$(jq -r .homebrew.app packaging/package-managers.json)"
          brew tap-new --no-git ci/local
          # Homebrew 7 loads casks only from trusted taps
          if brew help trust >/dev/null 2>&1; then brew trust ci/local; fi
          tapdir="$(brew --repository)/Library/Taps/ci/homebrew-local"
          mkdir -p "$tapdir/Casks"
          cp "$CASK_FILE" "$tapdir/Casks/"
          brew style --cask "ci/local/$CASK"
          brew audit --cask --online "ci/local/$CASK"
          brew install --cask "ci/local/$CASK"

          test -d "$app" || { echo "::error::$app isn't there"; exit 1; }
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
            echo "::error::The app is still quarantined"; exit 1
          fi
          said=$(defaults read "$app/Contents/Info.plist" CFBundleShortVersionString)
          [ "$said" = "$version" ] || { echo "::error::$app is version $said, expected $version"; exit 1; }
          # QueueCumber has no command-line interface: check that the app starts instead
          "$app/Contents/MacOS/$(defaults read "$app/Contents/Info.plist" CFBundleExecutable)" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "::error::The app exited at start"; exit 1; }
          kill "$pid"; wait "$pid" || true
          echo "$CASK $said installed, unquarantined and started"

          # --zap also checks the zap paths: the first start created the app's data folder
          ls -d ~/Library/Application\ Support/QueueCumber
          brew uninstall --cask --zap "ci/local/$CASK"
          test ! -e "$app" || { echo "::error::brew uninstall left $app behind"; exit 1; }
          test ! -e ~/Library/Application\ Support/QueueCumber || { echo "::error::zap left the app's data behind"; exit 1; }

      - name: Publish to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CASK: ${{ steps.cask.outputs.name }}
          CASK_FILE: ${{ steps.cask.outputs.file }}
        run: |
          set -euo pipefail
          if [ "$SUBMIT" != true ]; then echo 'Dry run: nothing published'; exit 0; fi
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then echo "::notice::HOMEBREW_TAP_TOKEN isn't set: Homebrew skipped"; exit 0; fi
          tap=$(jq -r .homebrew.tap packaging/package-managers.json)
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/$tap.git" tap
          mkdir -p tap/Casks
          cp "$CASK_FILE" tap/Casks/
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Casks/$CASK.rb"
          if git diff --cached --quiet; then echo "$CASK ${TAG#v} is already in the tap"; exit 0; fi
          git commit -m "$CASK ${TAG#v}"
          # Other projects publish to the same tap: on a race, rebase on theirs and try again
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then exit 0; fi
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            sleep $((attempt * 3))
          done
          echo '::error::Could not push to the tap'; exit 1

  aur:
    name: AUR
    if: contains(format(',{0},', inputs.channels || 'homebrew,aur,cloudsmith'), ',aur,')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'

      - name: Write the PKGBUILD
        id: pkg
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only stable release tags are published: $TAG"; exit 1; }
          meta=packaging/package-managers.json
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$(jq -r .checksums $meta)" -D release
          node scripts/package-managers-unix.mjs --version "$TAG" --sums "release/$(jq -r .checksums $meta)" --out out
          name=$(jq -r .aur.package $meta)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dir=out/aur/$name" >> "$GITHUB_OUTPUT"

      - name: .SRCINFO, then build, install and check in Arch Linux
        env:
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/$PKG_DIR:/pkg" -v "$PWD/scripts:/scripts:ro" \
            -e VERSION="${TAG#v}" -e PKG_NAME -e INSTALL_DIR="$(jq -r .aur.installDir packaging/package-managers.json)" \
            archlinux:latest bash -c '
            set -euo pipefail
            pacman -Syu --noconfirm --needed base-devel >/dev/null
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            cp -r /pkg /home/builder/pkg && chown -R builder /home/builder/pkg && cd /home/builder/pkg
            sudo -u builder makepkg --printsrcinfo > .SRCINFO
            sudo -u builder makepkg -si --noconfirm
            [ "$(stat -c %a "$INSTALL_DIR/chrome-sandbox")" = 4755 ] || { echo "chrome-sandbox is not setuid"; exit 1; }
            bash /scripts/check-linux-install.sh "$VERSION" pacman "$PKG_NAME" start
            cp .SRCINFO /pkg/.SRCINFO
          '
          cat "$PKG_DIR/PKGBUILD" "$PKG_DIR/.SRCINFO"

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          if [ "$SUBMIT" != true ]; then echo 'Dry run: nothing pushed'; exit 0; fi
          if [ "$(jq -r '.aur.enabled' packaging/package-managers.json)" != true ]; then
            echo "::notice::AUR is turned off in packaging/package-managers.json: built and tested, not pushed"; exit 0
          fi
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then echo "::notice::AUR_SSH_PRIVATE_KEY isn't set: AUR skipped"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'
          # A package that doesn't exist yet clones as an empty repository; the first push creates it
          git clone "ssh://aur@aur.archlinux.org/$PKG_NAME.git" aur-repo
          cp "$PKG_DIR/PKGBUILD" "$PKG_DIR/.SRCINFO" aur-repo/
          cd aur-repo
          git config user.name 'Davide Maggi'
          git config user.email 'davidemaggi@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "$PKG_NAME ${TAG#v} is already on the AUR"; exit 0; fi
          git commit -m "Update to ${TAG#v}"
          git push origin HEAD:master

  cloudsmith:
    name: Cloudsmith (apt, dnf)
    if: contains(format(',{0},', inputs.channels || 'homebrew,aur,cloudsmith'), ',cloudsmith,')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'

      - name: Download and check the .deb and .rpm files
        id: files
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only stable release tags are published: $TAG"; exit 1; }
          version="${TAG#v}"
          meta=packaging/package-managers.json
          sums=$(jq -r .checksums $meta)
          mkdir -p packages
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D release -p "$sums"
          for arch in $(jq -r '.cloudsmith.debArches[]' $meta); do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D packages -p "$(jq -r .cloudsmith.deb $meta | sed "s/{version}/$version/; s/{arch}/$arch/")"
          done
          for arch in $(jq -r '.cloudsmith.rpmArches[]' $meta); do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D packages -p "$(jq -r .cloudsmith.rpm $meta | sed "s/{version}/$version/; s/{arch}/$arch/")"
          done
          # The same bytes the release workflow listed
          (cd packages && sha256sum -c --ignore-missing "../release/$sums")
          node scripts/package-managers-unix.mjs --version "$TAG" --sums "release/$sums" --out out
          echo "repo=$(jq -r '"\(.cloudsmith.owner)/\(.cloudsmith.repository)"' $meta)" >> "$GITHUB_OUTPUT"
          echo "deb-package=$(jq -r .cloudsmith.debPackage $meta)" >> "$GITHUB_OUTPUT"
          echo "rpm-package=$(jq -r .cloudsmith.rpmPackage $meta)" >> "$GITHUB_OUTPUT"

      - name: Install the files themselves on Ubuntu and Fedora
        env:
          DEB_PACKAGE: ${{ steps.files.outputs.deb-package }}
          RPM_PACKAGE: ${{ steps.files.outputs.rpm-package }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          deb=$(basename "$(ls packages/*amd64*.deb)") rpm=$(basename "$(ls packages/*x86_64*.rpm)")
          docker run --rm -v "$PWD/packages:/p:ro" -v "$PWD/scripts:/scripts:ro" ubuntu:24.04 bash -c "
            set -euo pipefail
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /p/$deb >/dev/null
            bash /scripts/check-linux-install.sh $version deb $DEB_PACKAGE start"
          docker run --rm -v "$PWD/packages:/p:ro" -v "$PWD/scripts:/scripts:ro" fedora:latest bash -c "
            set -euo pipefail
            # Cisco's openh264 repository isn't needed and its mirrors are flaky; one retry for the rest
            dnf_install() { dnf install -y -q --disablerepo=fedora-cisco-openh264 \"\$@\" >/dev/null; }
            dnf_install /p/$rpm || { sleep 15; dnf_install /p/$rpm; }
            bash /scripts/check-linux-install.sh $version rpm $RPM_PACKAGE start"

      - name: Upload to Cloudsmith
        id: upload
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          REPO: ${{ steps.files.outputs.repo }}
        run: |
          set -euo pipefail
          if [ "$SUBMIT" != true ]; then echo 'Dry run: nothing uploaded'; exit 0; fi
          if [ -z "$CLOUDSMITH_API_KEY" ]; then echo "::notice::CLOUDSMITH_API_KEY isn't set: Cloudsmith skipped"; exit 0; fi
          pip install --quiet cloudsmith-cli
          # any-distro/any-version: one package for every Debian/Ubuntu and Fedora/RHEL release
          for f in packages/*.deb; do cloudsmith push deb "$REPO/any-distro/any-version" "$f" --republish; done
          for f in packages/*.rpm; do cloudsmith push rpm "$REPO/any-distro/any-version" "$f" --republish; done
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Install from the repository with apt and dnf
        if: steps.upload.outputs.uploaded == 'true'
        env:
          REPO: ${{ steps.files.outputs.repo }}
          DEB_PACKAGE: ${{ steps.files.outputs.deb-package }}
          RPM_PACKAGE: ${{ steps.files.outputs.rpm-package }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The README's commands. The index can lag a fresh upload by a little: retry with a pause.
          docker run --rm -v "$PWD/scripts:/scripts:ro" ubuntu:24.04 bash -c "
            set -euo pipefail
            apt-get update -qq && apt-get install -y -qq curl >/dev/null
            curl -1sLf https://dl.cloudsmith.io/public/$REPO/setup.deb.sh | bash
            apt_install() { apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $DEB_PACKAGE=$version >/dev/null; }
            apt_install || { sleep 30; apt_install; } || { sleep 60; apt_install; }
            bash /scripts/check-linux-install.sh $version deb $DEB_PACKAGE"
          # Our own .repo file: Cloudsmith's setup.rpm.sh sets an sslcacert that Fedora 43+ lacks
          docker run --rm -v "$PWD/out/cloudsmith:/repo:ro" -v "$PWD/scripts:/scripts:ro" fedora:latest bash -c "
            set -euo pipefail
            cp /repo/$RPM_PACKAGE.repo /etc/yum.repos.d/
            dnf_install() { dnf install -y -q --refresh --disablerepo=fedora-cisco-openh264 $RPM_PACKAGE-$version >/dev/null; }
            dnf_install || { sleep 30; dnf_install; } || { sleep 60; dnf_install; }
            bash /scripts/check-linux-install.sh $version rpm $RPM_PACKAGE"
