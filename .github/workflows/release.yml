name: Build release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed SemVer tag reachable from development
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/validate-release.mjs
  windows:
    needs: validate
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check signing configuration before Azure login
        run: node --input-type=module -e "import config from './electron-builder.windows.mjs'; config()"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package and sign app, embedded uninstaller and installer
        run: pnpm exec electron-builder --win --x64 --config electron-builder.windows.mjs --publish never
      - name: Verify application and installer signatures
        shell: pwsh
        run: ./scripts/verify-windows-signatures.ps1 -Directory release -Publisher $env:AZURE_SIGNING_PUBLISHER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows-x64-signed
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*-setup.exe
            release/*.zip
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
  draft:
    needs: [validate, windows, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.18.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true
      - run: node scripts/make-checksums.mjs release-assets
      - name: Create draft only; never overwrite or publish an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          actual="$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)"
          if [[ "$actual" != "$EXPECTED_COMMIT" ]]; then echo "Release tag moved during the build"; exit 1; fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG" --notes "Windows x64 uses Azure Artifact Signing. macOS arm64 artifacts are unsigned and unnotarized early testing builds. Linux x64 artifacts include AppImage, DEB and tar.gz. Review installation checks before publishing this draft." "${flags[@]}" release-assets/*
