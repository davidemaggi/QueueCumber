appId: dev.queuecumber.desktop
productName: QueueCumber
directories:
  output: release
files:
  - out/**/*
  - resources/*.png
  - package.json
mac:
  icon: resources/icon.icns
  target: [dmg, zip]
win:
  icon: resources/icon.ico
  target: [nsis, zip]
nsis:
  artifactName: QueueCumber-${version}-${arch}-setup.${ext}
linux:
  # Sized PNGs for hicolor; desktopName keeps Wayland app_id/WM_CLASS matched to the .desktop entry.
  icon: resources/linux
  syncDesktopName: true
  target: [AppImage, deb, rpm, tar.gz]
